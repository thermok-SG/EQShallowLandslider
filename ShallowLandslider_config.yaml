dem_path:  "input_data/dem/SRTMGL1_28.169999999999998_85.03_28.3_85.21000000000001.asc"
# Used to assign metric grid spacing to geographic ASCII DEMs. Supported values
# in get_topo include SRTMGL1, NASADEM, AW3D30, COP30, SRTMGL3, and COP90.
dem_type: "SRTMGL1"
smooth_num: 0

save_pickle: false
output_dir: "runs/"

# v1.2 analysis outputs. CSV is always written. If Zarr or Parquet support is
# unavailable, rasters fall back to memory-mappable .npy files and CSV remains.
outputs:
  write_parquet: true
  write_zarr: true
  write_npy_fallback: true
  zarr_chunks: [1024, 1024]

random_seed: 5000


flow_params:
  enable: true
  flow_metric: "D8"
  separate_hill_flow: true
  hill_flow_metric: "Quinn"       # multiflow routing required by runout
  depression_handler: "fill"
  update_hill_depressions: true
  accumulate_flow: true

chunking:
  mode: "auto"                  # auto | always | never
  threshold_cells: 20000000      # DEMs >20M cells → chunked mode
  tile_size: [2500, 2500]        # Size of tile core region
  overlap: 10                     # Necessary for slope/aspect stability

soil_params:
  cohesion_eff: 15000
  angle_int_frict: 30
  submerged_soil_proportion: 0.5
  max_soil_depth: 1.5
  distribution: "mean_elev_curv"
  relationship: "linear_std_local"

  # Elevation-based params
  decay_rate: 1.0 # for relationship == "exponential"
  exponent: 2.0 # for relationship == "power"
  # Drainage-area based params
  drainage_transform: threshold
  drainage_threshold: 1e6 # Flow accumulation threshold
  drainage_power: 0.3
  # Curvature-based params
  P0: 0.05
  h_star: 1.0
  D: 0.01
  h_min: 0.1
  h_no_ss: 0.0

pga:
  horizontal_max: 0.5
  vertical_max: 0.2
  distribution: "uniform"       # uniform | circular | square | diamond | exponential
  center: null                   # optional [row, column] in the global DEM
  random_center: false           # overrides center when true
  seed: null                     # null uses the top-level random_seed

simulation:
  selection_method: "probabilistic"
  proportion_method: "conservative" # empirical|statistical|risk_profile|adaptive|conservative
  # A non-null value overrides proportion_method and must be in (0, 1].
  custom_proportion: null
  handle_small: "merge"
  aspect_interval: 20 # interval for topographic aspect zones
  verbose: false
  n_jobs: 1

  compute_displacement: false
  time_shaking: 10 # seconds (used for Newmark displacement if enabled)
  displacement_threshold: 0.0
  # Runout requires full-grid mode, compute_displacement: true,
  # enable_runout: true, update_soil: true, flow_params.enable: true,
  # and flow_params.separate_hill_flow: true.
  enable_runout: false
  update_soil: false

split_by_width:
  enabled: true
  pickle_path: "input_data/nepal/measured_data.pkl"
  min_area: 900
  csv_paths:
    inventory_csv: "input_data/nepal/measuredLandslides_all.csv"
    zonal_stats_csv: "input_data/nepal/measuredLandslides_all_ZonalStats.csv"
  width_threshold: 1.5
  max_iterations: 5
  min_region_size: 10
  convergence_threshold: 0.75
